name: Fix menu script
on:
  push:
    branches: [fix/menu-clicks]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nested script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='})();\n<script>\nconst B='
          new='})();\nconst B='
          if old not in s:
              raise SystemExit('Nested script tag pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Actually fix menu JavaScript' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-menu.yml
          git commit -m 'Remove temporary fix workflow'
          git push
