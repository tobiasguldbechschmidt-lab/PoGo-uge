name: Fix JavaScript syntax now
on:
  push:
    paths:
      - '.github/workflows/fix-js-syntax-now.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair broken JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('async async function showIncenseSpawns(){','async function showIncenseSpawns(){',1)
          s=s.replace('function showDailyDuration(){open(', 'async function showDailyDuration(){open(',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix JavaScript syntax that broke menu navigation'
          git push
