name: Update regular Incense current bonus duration
on:
  push:
    paths:
      - '.github/workflows/update-incense-duration-current-bonus.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix regular Incense bonus detection
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let bonus=active.find(e=>e.article_url&&/incense/i.test(JSON.stringify(e.details||{}))&&/duration|varighed/i.test(JSON.stringify(e.details||{})));"
          new="let bonus=active.find(e=>{let txt=JSON.stringify(e||{}).toLowerCase();let isInc=/incense/.test(txt);let isDaily=/daily adventure incense|daily adventure|adventure incense/.test(txt);let isDuration=/duration|varighed|timer|hours|minutes|minutter/.test(txt);return isInc&&!isDaily&&isDuration});"
          if old in s:
              s=s.replace(old,new,1)
          old2="var txt=JSON.stringify(e||{}).toLowerCase();"
          new2="var txt=JSON.stringify(e||{}).toLowerCase();\n      if(/daily adventure incense|daily adventure|adventure incense/.test(txt))return null;"
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          import re,subprocess
          s=open('index.html').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No scripts found')
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'; open(f,'w').write(js); subprocess.run(['node','--check',f],check=True)
          print('Validated',len(scripts),'script blocks')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Ignore Daily Adventure Incense for regular Incense bonus'
          git push
