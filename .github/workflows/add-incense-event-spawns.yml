name: Add automatic Incense event spawns
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-incense-event-spawns.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Incense event spawns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="function dailyIncenseCards(){return '<div class=section>Daily Adventure Incense</div><button class=\"card click\" data-daily=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🧭</span><div class=grow><div class=name>Spawns</div><div class=small>Se Pokémon-poolen</div></div>›</div></button>'}"
          if old not in s:
              old="function dailyIncenseCards(){return '<div class=section>Daily Incense</div><button class=\"card click\" data-daily=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🧭</span><div class=grow><div class=name>Spawns</div><div class=small>Se Pokémon-poolen</div></div>›</div></button>'}"
          if old not in s:
              raise SystemExit('dailyIncenseCards block not found')

          new="function dailyIncenseCards(){return '<div class=section>Daily Adventure Incense</div><button class=\"card click\" data-daily=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🧭</span><div class=grow><div class=name>Spawns</div><div class=small>Se Pokémon-poolen</div></div>›</div></button><div class=section>Incense</div><button class=\"card click\" data-incense-spawns=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🌫️</span><div class=grow><div class=name>Spawns</div><div class=small>Pokémon fra det aktuelle event</div></div>›</div></button>'}"
          s=s.replace(old,new,1)

          if 'async function showIncenseSpawns()' not in s:
              marker='function showDailyIncense()'
              i=s.find(marker)
              if i<0: raise SystemExit('showDailyIncense marker not found')
              fn=r'''async function showIncenseSpawns(){
            $('x').onclick=()=>$('modal').classList.remove('open');
            try{
              let a=await ev(),n=N();
              let active=a.filter(e=>e.start&&e.start<=n&&(!e.end||e.end>=n));
              let candidates=active.filter(e=>{
                let d=e.details||{};
                return Object.keys(d).some(k=>/incense|spawn/i.test(k)&&Array.isArray(d[k])&&d[k].some(v=>v&&typeof v==='object'&&v.name));
              });
              candidates.sort((x,y)=>(y.start||0)-(x.start||0));
              let e=candidates[0]||active.filter(e=>Array.isArray(e.details?.spawns)&&e.details.spawns.length).sort((x,y)=>(y.start||0)-(x.start||0))[0];
              if(!e){open('<h2>Incense</h2><div class=note>Der er ingen aktive event-spawns til Incense lige nu.</div>');return}
              let d=e.details||{},keys=Object.keys(d).filter(k=>/incense/i.test(k)&&Array.isArray(d[k]));
              if(!keys.length&&Array.isArray(d.spawns))keys=['spawns'];
              let list=[];keys.forEach(k=>{if(Array.isArray(d[k]))d[k].forEach(v=>{if(v&&v.name&&!list.some(x=>x.name===v.name))list.push(v)})});
              if(!list.length){open(`<h2>Incense</h2><div class=small>${E(e.title)}</div><div class=note>Ingen Incense-spawns er registreret for dette event endnu.</div>`);return}
              open(`<h2>Incense Spawns</h2><div class=small>${E(e.title)}</div><div class=section>Pokémon</div>${list.map(p=>`<div class=card><div class=row><div class=img>${p.asset_url?`<img src="${E(p.asset_url)}" alt="${E(p.name)}" loading="lazy">`:''}</div><div class=grow><div class=name>${E(p.name)}</div><div class=small>${p.shiny_available?'Shiny tilgængelig':'Shiny ikke oplyst'}</div></div></div></div>`).join('')}<div class=section>Event</div><div class=small>${E(e.title)}</div>`);
            }catch(err){open('<h2>Incense</h2><div class=note>Kunne ikke hente det aktuelle Incense-event. Tryk ↻ og prøv igen.</div>')}
          }
          '''
              s=s[:i]+fn+s[i:]

          anchor="b.querySelectorAll('[data-daily]').forEach(x=>x.onclick=()=>showDailyIncense());"
          handler="b.querySelectorAll('[data-incense-spawns]').forEach(x=>x.onclick=()=>showIncenseSpawns());"
          if handler not in s:
              if anchor not in s: raise SystemExit('daily handler anchor not found')
              s=s.replace(anchor,anchor+handler,1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add automatic current-event Incense spawns'
          git push
