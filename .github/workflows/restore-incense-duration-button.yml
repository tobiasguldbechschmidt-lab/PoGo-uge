name: Restore regular Incense duration button
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/restore-incense-duration-button.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore duration button
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text()
          pat=r"(function dailyIncenseCards\(\)\{return '.*?)(</button>'\})"
          m=re.search(pat,s)
          if not m:
              raise SystemExit('dailyIncenseCards function not found')
          block=m.group(0)
          if 'incenseDurationCard()' not in block:
              s=s[:m.start()]+m.group(1)+"</button>'+incenseDurationCard()}"+s[m.end():]
              p.write_text(s)
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'
              Path(f).write_text(js)
              subprocess.run(['node','--check',f],check=True)
          print('JavaScript validated')
          PY
      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore regular Incense duration button'
          git push
