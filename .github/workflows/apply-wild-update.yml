name: Apply wild update immediately

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wild-update.yml'
      - '.github/workflows/add-wild-event-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the prepared wild patch
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          wf=Path('.github/workflows/add-wild-event-links.yml').read_text(encoding='utf-8')
          m=re.search(r"replacement=r'''(.*?)'''",wf,re.S)
          if not m: raise SystemExit('Prepared wild replacement not found')
          replacement=m.group(1)
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.find('async function wild(){')
          if start<0: raise SystemExit('wild function not found')
          brace=s.find('{',start); depth=0; end=-1
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end<0: raise SystemExit('wild function end not found')
          s=s[:start]+replacement+s[end:]
          blocks=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(blocks,1):
              f=Path(f'/tmp/wild-script-{i}.js'); f.write_text(js,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          for marker in ['Sæson-spawns','Regionale','regionalCards','Ingen aktive event-spawns registreret lige nu']:
              if marker not in s: raise SystemExit('Missing '+marker)
          p.write_text(s,encoding='utf-8')
      - name: Commit and deploy
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git add index.html
          git commit -m 'Apply wild section update directly'
          git push
