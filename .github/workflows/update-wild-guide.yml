name: Update wild guide safely
on:
  push:
    paths:
      - '.github/workflows/update-wild-guide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch isolated guide
        run: python scripts/patch-wild-guide.py
      - name: Commit guide
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- index.html; then echo 'No changes'; exit 0; fi
          git add index.html
          git commit -m 'Add event spawns and Pokemon details'
          git push
