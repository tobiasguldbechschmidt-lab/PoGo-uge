name: Add Daily Incense
on:
  push:
    paths:
      - '.github/workflows/add-daily-incense.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="v[2]===1?'Ekstremt sjælden':v[2]===2?'Meget sjælden':v[2]===3?'Sjælden':'Sjælden evolution'"
          new="v[2]===1?'Ca. 1 ud af 500':v[2]===2?'Ca. 1 ud af 50':v[2]===3?'Ca. 1 ud af 20':'Ca. 1 ud af 10'"
          if old not in s:
              raise SystemExit('Daily Incense rarity text not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show Daily Incense spawn odds'
          git push
