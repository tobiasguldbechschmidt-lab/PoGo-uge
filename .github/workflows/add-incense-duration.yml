name: Add regular Incense duration info
on:
  push:
    paths:
      - index.html
      - .github/workflows/add-incense-duration.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good Incense UI
        run: |
          set -e
          # The previous generated index introduced a stray fragment into the
          # main script. Restore the last known-good index before adding nothing
          # else. The normal Incense card is already present in this snapshot.
          git checkout a72e8247eaca511665990fda772486049dadae4d -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not scripts:
              raise SystemExit('No JavaScript found')
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'
              Path(f).write_text(js)
              subprocess.run(['node','--check',f],check=True)
          print('Known-good index.html JavaScript validated.')
          PY
      - name: Commit restored UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore menu-safe Incense UI'
          git push
