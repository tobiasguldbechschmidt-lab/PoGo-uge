name: Fix Incense back button
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/fix-incense-back.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix modal back behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="async function showIncenseSpawns(){\n  try{"
          new="async function showIncenseSpawns(){\n  $('x').onclick=()=>$('modal').classList.remove('open');\n  try{"
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Incense modal back button'
          git push
