name: Fix regular Incense
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-regular-incense.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'
              Path(f).write_text(js)
              subprocess.run(['node','--check',f],check=True)
          print('JavaScript validated; no legacy UI rewrite performed.')
          PY
