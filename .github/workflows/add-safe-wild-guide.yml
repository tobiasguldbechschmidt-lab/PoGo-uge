name: Add safe in-app wild guide

on:
  push:
    paths:
      - '.github/workflows/add-safe-wild-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated wild guide
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="wild-guide"' in s:
              print('Wild guide already present')
              raise SystemExit(0)
          marker = '<div id="wild" class="empty">Henter…</div>'
          if marker not in s:
              raise SystemExit('Wild container not found')
          guide = r'''<div id="wild-guide" style="margin-top:14px"><div class="section">Wild-guide</div><div class="note">Denne guide ligger separat fra den eksisterende In The Wild-feed, så den ikke kan ødelægge den. Sæson-listen er en vejledning, mens Regionale viser normale geografiske områder.</div><div style="display:flex;gap:8px;margin:0 0 10px"><button type="button" class="wild-tab active" data-guide-tab="season">Sæson</button><button type="button" class="wild-tab" data-guide-tab="regional">Regionale</button></div><div id="wild-guide-content"></div></div><script>(function(){const season=['Maschiff','Mabosstiff','Rhyhorn','Sneasel','Sizzlipede','Flamigo','Weedle','Pidgey','Houndour','Carvanha','Emolga','Fletchling','Noibat','Rookidee'];const regional=[['Farfetch’d','Japan, Sydkorea, Taiwan og Hong Kong',83],['Kangaskhan','Australien',115],['Mr. Mime','Europa',122],['Tauros','USA og det sydlige Canada',128],['Heracross','Central- og Sydamerika',214],['Corsola','Bestemte tropiske kystområder',222],['Tropius','Afrika og dele af Mellemøsten',357],['Relicanth','New Zealand og Oceanien',369],['Comfey','Hawaii',764],['Hawlucha','Mexico',701],['Stonjourner','Storbritannien',874]];const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const box=document.getElementById('wild-guide-content');const img=id=>id?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`:'';function render(tab){document.querySelectorAll('[data-guide-tab]').forEach(x=>x.classList.toggle('active',x.dataset.guideTab===tab));if(tab==='season'){box.innerHTML='<div class="section">Sæson-/wild-rotation</div>'+season.map(n=>`<div class="card"><div class="row"><div class="img">🌿</div><div class="grow"><div class="name">${esc(n)}</div><div class="small">Kendt sæson-/wild-rotation; den præcise pool kan ændres af område, biome og aktive events.</div></div></div></div>`).join('')}else{box.innerHTML='<div class="section">Regionale Pokémon</div>'+regional.map(p=>`<div class="card"><div class="row"><div class="img"><img src="${img(p[2])}" alt="${esc(p[0])}" loading="lazy" onerror="this.parentElement.textContent='🌍'"></div><div class="grow"><div class="name">${esc(p[0])}</div><div class="small">📍 ${esc(p[1])}</div></div></div></div>`).join('')}}document.querySelectorAll('[data-guide-tab]').forEach(x=>x.onclick=()=>render(x.dataset.guideTab));render('season')})()</script>'''
          s = s.replace(marker, marker + guide, 1)
          p.write_text(s, encoding='utf-8')
          # Validate every script block before committing.
          import re
          blocks = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', s, re.I)
          for i, js in enumerate(blocks, 1):
              f = Path(f'/tmp/check-{i}.js')
              f.write_text(js, encoding='utf-8')
              subprocess.run(['node','--check',str(f)], check=True)
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- index.html; then echo 'No changes'; exit 0; fi
          git add index.html
          git commit -m 'Add isolated in-app wild guide'
          git push
