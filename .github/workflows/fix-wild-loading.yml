name: Fix In The Wild loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wild-loading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-wild-loading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect In The Wild loader
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          for needle in ['async function ev','const n=N()','const a=await ev','function N(','function showPage','data-p="wild"']:
              i=text.find(needle)
              print(f'\n===== {needle} @ {i} =====')
              if i>=0: print(text[max(0,i-1200):i+3000])
          print('\nSCRIPT BLOCKS:',len(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)))
      - name: Validate every JavaScript block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,block in enumerate(blocks,1):
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(block); name=f.name
            subprocess.run(['node','--check',name],check=True)
          print(f'Validated {len(blocks)} JavaScript blocks')
