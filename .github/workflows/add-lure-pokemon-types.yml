name: Add clickable Lure Pokemon types

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-lure-pokemon-types.yml'
      - 'scripts/add-lure-pokemon-types.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: python3 scripts/add-lure-pokemon-types.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then echo 'No changes'; exit 0; fi
          git add index.html
          git commit -m 'Make Lure Pokemon clickable for type details'
          git push
