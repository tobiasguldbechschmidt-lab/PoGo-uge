name: Add regular Incense duration info
on:
  push:
    paths:
      - index.html
      - .github/workflows/add-incense-duration.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair regular Incense UI safely
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('index.html'); s=p.read_text()
          start=s.find('function dailyIncenseCards(){'); end=s.find('async function showDailyIncense',start)
          if start<0 or end<0: raise SystemExit('dailyIncenseCards not found')
          block=re.sub(r"\+incenseDurationCard\(\)","",s[start:end]); s=s[:start]+block+s[end:]
          duration="<div class=section>Normal Incense</div><button class=\"card click\" data-incense-duration=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=font-size:25px>⏱️</span><div class=grow><div class=name>Varighed</div><div class=small>Normal varighed – 60 minutter</div></div>›</div></button>"
          normal_fn="function regularIncenseCards(){return '"+duration.replace("'","\\'")+"'}"
          a=s.find('function regularIncenseCards(){')
          if a>=0:
              b=s.find('function dailyIncenseCards(){',a); s=s[:a]+normal_fn+'\n'+s[b:]
          else: s=s.replace('function dailyIncenseCards(){',normal_fn+'\nfunction dailyIncenseCards(){',1)
          s=s.replace("if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards()+bonusCards(inc,'Incense');", "if(tab==='incense')b.querySelector('#wild-content').innerHTML=regularIncenseCards()+dailyIncenseCards();")
          s=s.replace("if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards();", "if(tab==='incense')b.querySelector('#wild-content').innerHTML=regularIncenseCards()+dailyIncenseCards();")
          # Replace only between stable function boundaries; this avoids the old regex corruption.
          fn="""function showIncenseDuration(){
          let now=N(),a=C.ev||[],active=a.filter(e=>(!e.start||e.start<=now)&&(!e.end||e.end>=now));
          let bonus=active.find(e=>{let txt=JSON.stringify(e||{}).toLowerCase();if(!e.article_url)return false;if(/daily adventure incense|daily adventure|adventure incense/.test(txt))return false;return /incense/.test(txt)&&/(incense duration|incense lasts|incense will last|duration of incense|incense[^a-z]*(60 minutes|2 hours|3 hours|longer|increased|increase|duration)|(?:60 minutes|2 hours|3 hours)[^a-z]*incense)/.test(txt)});
          let h='<h2>Incense · Varighed</h2><div class=section>Normal varighed</div><div class=card><b>Normal varighed – 60 minutter</b><div class=small>Almindelig Incense varer normalt 60 minutter.</div></div>';
          h+='<div class=section>1. Aktuel bonus</div>'+(bonus?'<div class=card><b>'+E(bonus.title)+'</b><div class=small>Dette event ændrer varigheden for almindelig Incense.</div></div>':'<div class=note>Ingen aktiv bonus til almindelig Incense registreret lige nu.</div>');
          h+='<div class=section>2. Sådan virker det</div><div class=card><div class=small>• Normal Incense varer 60 minutter.<br>• Særlige events kan ændre varigheden.<br>• Normal Incense er adskilt fra Daily Adventure Incense.</div></div>';
          h+='<div class=section>3. Officiel info</div><div class=card><div class=small>Niantics officielle hjælpecenter beskriver almindelig Incense som normalt 60 minutter og særlige eventændringer separat.</div></div>';
          h+='<div class=section>4. Stacking – op til 24 timer</div><div class=card><div class=small>Flere almindelige Incense kan stables, så den samlede varighed kan nå op til 24 timer.</div></div>';
          h+='<div class=section>5. Daily Adventure Incense</div><div class=card><div class=small>Daily Adventure Incense er en separat Incense-type med sin egen varighed.</div></div>';
          h+='<div class=section>6. GO Pass-events</div><div class=card><div class=small>Et GO Pass-event vises kun som normal Incense-bonus, hvis eventdataene specifikt dokumenterer ændret normal Incense.</div></div>'; open(h); }
          """
          a=s.find('function showIncenseDuration(){'); b=s.find('async function showIncenseSpawns(){',a)
          if a<0 or b<0: raise SystemExit('showIncenseDuration boundaries not found')
          s=s[:a]+fn+s[b:]
          if "closest('[data-incense-duration]')" not in s:
              s=s.replace("function open(h){","document.addEventListener('click',e=>{let b=e.target.closest('[data-incense-duration]');if(b){e.stopPropagation();showIncenseDuration()}});function open(h){",1)
          p.write_text(s)
          scripts=re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',s)
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'; Path(f).write_text(js); subprocess.run(['node','--check',f],check=True)
          PY
      - name: Commit repaired UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Repair Incense UI and preserve menu navigation'
          git push
