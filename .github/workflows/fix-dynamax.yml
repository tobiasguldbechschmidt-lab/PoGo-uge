name: Fix Dynamax

on:
  push:
    paths:
      - 'scripts/fix-dynamax.py'
      - 'scripts/update-dynamax-data.py'
      - 'scripts/add-raid-dynamax-end-times.py'
      - '.github/workflows/fix-dynamax.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current Max Battle data
        run: |
          python3 scripts/update-dynamax-data.py
          python3 - <<'PY'
          import json
          with open('data/maxbattles.json',encoding='utf-8') as f:
              d=json.load(f)
          c=d.get('currentList',{})
          count=sum(len(v) for v in c.values() if isinstance(v,list))
          if count == 0:
              raise SystemExit('Current Max Battle data is empty')
          print(f'Current Max Battle entries: {count}')
          PY

      - name: Apply Dynamax patch
        run: python3 scripts/fix-dynamax.py

      - name: Add Raid and Dynamax end times
        run: python3 scripts/add-raid-dynamax-end-times.py

      - name: Validate Dynamax
        run: |
          grep -q 'data/maxbattles.json' index.html
          grep -q 'ca. 1/20 (5 %)' index.html
          grep -q 'Spillere' index.html
          grep -q 'Raid / Max Battle rotation end times' index.html
          python3 - <<'PY'
          import re, subprocess, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks,1):
              p=pathlib.Path(f'/tmp/dynamax-{i}.js'); p.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Validated {len(blocks)} JavaScript blocks')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/maxbattles.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Refresh current Dynamax Max Battles and end times'
            git push
          fi
