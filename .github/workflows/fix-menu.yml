name: Fix menu script
on:
  push:
    branches: [fix/menu-clicks]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nested script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '})();\n<script>\nconst B='
          new = '})();\n</script><script>\nconst B='
          if old not in s:
              raise SystemExit('Expected broken script sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Actually fix menu navigation script'
          git push
