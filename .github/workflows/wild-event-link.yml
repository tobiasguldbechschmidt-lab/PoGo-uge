name: Link Wild Event Details
on:
  push:
    paths:
      - '.github/workflows/wild-event-link.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          notes = [
              'Sorteret fra sjældnest til mindst sjælden. Listen viser den særlige Daily Adventure Incense-pool.',
              'Sorteret fra sjældnest til mindst sjælden. Listen viser den særlige Daily Adventure Incense-Pool.',
              'Sorteret fra sjældnest til mindst sjælden.'
          ]
          for note in notes:
              s=s.replace(note,'')
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove Daily Incense sorting note'
          git push
