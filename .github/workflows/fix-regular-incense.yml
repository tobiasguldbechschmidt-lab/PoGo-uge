name: Fix regular Incense
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-regular-incense.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch regular Incense
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Remove the duplicate lower Incense section from the existing Incense tab.
          old="<div class=section>Incense</div><button class=\"card click\" data-incense-spawns=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🌫️</span><div class=grow><div class=name>Spawns</div><div class=small>Pokémon fra det aktuelle event</div></div>›</div></button>"
          s=s.replace(old,'',1)

          # Make the remaining Incense button functional: it opens a list of Pokémon
          # from the active event's Incense-related spawn data, with a safe fallback.
          marker='async function showIncenseSpawns(){'
          start=s.find(marker)
          if start!=-1:
              end=s.find('async function showDailyDuration(){',start)
              if end!=-1:
                  new=r'''async function showIncenseSpawns(){
            try{
              let a=await ev(),n=N();
              let active=a.filter(e=>(!e.start||e.start<=n)&&(!e.end||e.end>=n));
              active.sort((x,y)=>(y.start||0)-(x.start||0));
              let e=active[0],list=[];
              for(const evn of active){
                let d=evn.details||{};
                let vals=[];
                Object.keys(d).forEach(k=>{
                  if(/incense/i.test(k)&&Array.isArray(d[k])) vals.push(...d[k]);
                });
                if(!vals.length&&Array.isArray(d.spawns)) vals=d.spawns;
                vals.forEach(v=>{
                  if(v&&v.name&&!list.some(x=>x.name===v.name)) list.push(v);
                });
                if(list.length){e=evn;break}
              }
              if(!list.length){
                open('<h2>Incense</h2><div class=note>Der er ingen Incense-spawns registreret for det aktuelle event endnu.</div>');
                return;
              }
              open(`<h2>Incense</h2><div class=small>${E(e.title)}</div><div class=section>Spawns</div>${list.map((p,i)=>`<div class=\"card click\" data-inc-p=\"${i}\"><div class=row><div class=img>${p.asset_url?`<img src=\"${E(p.asset_url)}\" alt=\"${E(p.name)}\" loading=\"lazy\">`:'🌫️'}</div><div class=grow><div class=name>${E(p.name)}</div><div class=small>${p.shiny_available===true?'✨ Shiny mulig':'Shiny ikke oplyst'}</div></div>›</div></div>`).join('')}`);
              document.querySelectorAll('[data-inc-p]').forEach(x=>x.onclick=async()=>{
                let p=list[+x.dataset.incP],q=await poke(pid(p)),ts=[];
                let add=v=>{if(v==null)return;if(Array.isArray(v)){v.forEach(add);return}if(typeof v==='object'){add(v.name??v.type??v.value??v.typeName);return}let z=typeof v==='number'?TYPE_NAMES[v]:String(v).trim();if(z&&!ts.includes(z))ts.push(z)};
                add(q?.types);add(q?.type);add(q?.type1);add(q?.type2);add(p?.types);add(p?.type);add(p?.type1);add(p?.type2);
                let sc=p.shiny_chance??p.shinyChance??p.shiny_odds;
                let shinyText=sc!=null?(typeof sc==='number'?'1/'+Math.round(sc<1?1/sc:sc):String(sc)):(p.shiny_available===true?'ca. 1/512':'Ikke oplyst');
                $('x').onclick=()=>showIncenseSpawns();
                open(`<h2>${E(p.name)}</h2><div class=section>Type</div><div class=card>${E(ts.join(' · ')||'Ikke oplyst')}</div><div class=section>Shiny-chance</div><div class=card>${E(shinyText)}</div><div class=section>Event</div><div class=card>${E(e.title)}</div>`);
              });
            }catch(err){open('<h2>Incense</h2><div class=note>Kunne ikke hente Incense-spawns. Tryk ↻ og prøv igen.</div>')}
          }
          '''
                  s=s[:start]+new+s[end:]

          # Replace the Incense tab content with exactly one Incense section + Spawns button.
          oldfn="function dailyIncenseCards(){return '<div class=section>Daily Adventure Incense</div><button class=\"card click\" data-daily=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🧭</span><div class=grow><div class=name>Spawns</div><div class=small>Se Pokémon-poolen</div></div>›</div></button><button class=\"card click\" data-dai-duration=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">⏱️</span><div class=grow><div class=name>Varighed</div><div class=small>Se den aktuelle varighed og hvilken GO Pass-rank der giver længere Daily Adventure Incense</div></div>›</div></button><div class=section>Incense</div><button class=\"card click\" data-incense-spawns=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🌫️</span><div class=grow><div class=name>Spawns</div><div class=small>Pokémon fra det aktuelle event</div></div>›</div></button>'}"
          newfn="function dailyIncenseCards(){return '<div class=section>Daily Adventure Incense</div><button class=\"card click\" data-daily=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🧭</span><div class=grow><div class=name>Spawns</div><div class=small>Se Pokémon-poolen</div></div>›</div></button><button class=\"card click\" data-dai-duration=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">⏱️</span><div class=grow><div class=name>Varighed</div><div class=small>Se den aktuelle varighed og hvilken GO Pass-rank der giver længere Daily Adventure Incense</div></div>›</div></button><div class=section>Incense</div><button class=\"card click\" data-incense-spawns=\"1\" style=\"width:100%;text-align:left\"><div class=row><span style=\"font-size:25px\">🌫️</span><div class=grow><div class=name>Spawns</div><div class=small>Pokémon fra det aktuelle event</div></div>›</div></button>'}"
          if oldfn in s:
              s=s.replace(oldfn,newfn,1)

          # Ensure the remaining button has a click handler even if an older handler was removed.
          hook="document.addEventListener('click',e=>{let b=e.target.closest('[data-incense-spawns]');if(b){e.stopPropagation();showIncenseSpawns()}});"
          if hook not in s:
              insert=s.find("function showDailyIncense(){")
              if insert!=-1:s=s[:insert]+hook+s[insert:]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix regular Incense spawns button and remove duplicate'
          git push