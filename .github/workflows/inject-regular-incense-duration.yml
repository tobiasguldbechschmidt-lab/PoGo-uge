name: Inject regular Incense duration UI
on:
  push:
    paths:
      - '.github/workflows/inject-regular-incense-duration.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject isolated duration UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='id="regular-incense-duration-inject"'
          if marker not in s:
              block='''<script id="regular-incense-duration-inject">\n(function(){\n  function addButton(){\n    var root=document.querySelector('#wild-content');\n    if(!root||root.querySelector('[data-incense-duration]')) return;\n    var heads=[...root.querySelectorAll('.section')];\n    var sec=heads.find(function(x){return x.textContent.trim()==='Incense'});\n    if(!sec) return;\n    var spawn=sec.nextElementSibling;\n    if(!spawn||!spawn.matches('[data-incense-spawns]')) return;\n    var b=document.createElement('button');\n    b.className='card click';\n    b.dataset.incenseDuration='1';\n    b.style.cssText='width:100%;text-align:left';\n    b.innerHTML='<div class=row><span style="font-size:25px">⏱️</span><div class=grow><div class=name>Varighed</div><div class=small>Se hvor længe Incense varer og aktive bonusser</div></div>›</div>';\n    spawn.insertAdjacentElement('afterend',b);\n  }\n  async function show(){\n    var now=new Date(),events=[];\n    try{if(typeof ev==='function')events=await ev()}catch(e){}\n    var active=events.filter(function(e){return (!e.start||e.start<=now)&&(!e.end||e.end>=now)});\n    var bonus=active.find(function(e){return e.article_url&&/incense/i.test(JSON.stringify(e.details||{}))&&/duration|varighed/i.test(JSON.stringify(e.details||{}))});\n    var h='<h2>Incense · Varighed</h2><div class=section>Normal varighed</div><div class=card><b>60 minutter</b><div class=small>Almindelig Incense varer normalt 60 minutter.</div></div><div class=section>Aktuel bonus</div>';\n    if(bonus){h+='<div class=card><b>'+E(bonus.title)+'</b><div class=small>Dette event kan forlænge Incense-varigheden.</div><p><button class="btn" type="button" data-event-url="'+E(bonus.article_url)+'" style="width:100%;cursor:pointer">Åbn eventet ↗</button></p></div>'}\n    else{h+='<div class=note>Ingen aktiv Incense-varighedsbonus registreret lige nu.</div>'}\n    h+='<div class=section>Sådan virker det</div><div class=card><div class=small>• Normal Incense: 60 minutter.<br>• Særlige events kan gøre den længere.<br>• Flere Incense kan stables op til 24 timer.<br>• Daily Adventure Incense har sin egen varighed.</div></div><div class=section>Officiel info</div><div class=card><button class="btn" type="button" data-external-url="https://niantic.helpshift.com/hc/en/6-pokemon-go/faq/2480-what-are-incense/?hl=en" style="width:100%;cursor:pointer">Åbn officiel Incense-info ↗</button></div>';\n    if(typeof open==='function')open(h);\n  }\n  document.addEventListener('click',function(e){var b=e.target.closest('[data-incense-duration]');if(b){e.stopPropagation();show()}});\n  document.addEventListener('click',function(e){var b=e.target.closest('[data-external-url]');if(b){e.stopPropagation();location.href=b.dataset.externalUrl}});\n  new MutationObserver(addButton).observe(document.body,{childList:true,subtree:true});\n  addButton();\n})();\n</script>'''
              if '</body>' not in s: raise SystemExit('body end not found')
              s=s.replace('</body>',block+'</body>',1)
              p.write_text(s)
          PY
          python3 - <<'PY'
          import re,subprocess,tempfile
          s=open('index.html').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No scripts found')
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'
              open(f,'w').write(js)
              subprocess.run(['node','--check',f],check=True)
          print('Validated',len(scripts),'script blocks')
          PY
      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add regular Incense duration button'
          git push
