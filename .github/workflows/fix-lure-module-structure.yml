name: Refresh Lure Module data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lure-module-structure.yml'
      - 'scripts/fix-lure-module.py'
      - 'scripts/add-lure-shiny-details.py'
      - 'scripts/add-special-lure-modules.py'
      - 'scripts/match-lure-incense-spawns.py'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Lure Module structure
        run: python3 scripts/fix-lure-module.py
      - name: Refresh Lure shiny details
        run: python3 scripts/add-lure-shiny-details.py
      - name: Refresh special Lure Modules
        run: python3 scripts/add-special-lure-modules.py
      - name: Refresh Lure event/spawn matching
        run: python3 scripts/match-lure-incense-spawns.py
      - name: Validate JavaScript and Lure markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          required=['data-wtab="lure"','Lure Module','Lure Module · Spawns','Glacial Lure','Mossy Lure','Magnetic Lure','Rainy Lure','Golden Lure','data-special-lure=','data-special-lure-p=']
          for x in required:
              if x not in s: raise SystemExit('Missing: '+x)
          blocks=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('No JavaScript blocks found')
          for i,js in enumerate(blocks,1):
              f=Path(tempfile.gettempdir())/f'pogo-lure-{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'Validated {len(blocks)} JavaScript blocks')
          PY
      - name: Commit refreshed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Refresh Lure Module data'
            git push
          fi
