name: Restore regular Incense duration button
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/restore-incense-duration-button.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'
              Path(f).write_text(js)
              subprocess.run(['node','--check',f],check=True)
          print('JavaScript validated; no file changes made.')
          PY
