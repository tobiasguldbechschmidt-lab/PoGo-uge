name: Patch raid swipe UI
on:
  push:
    branches: [fix/live-overview-wild-dynamax-battles]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.chips{display:flex;gap:7px;overflow:auto}', '.chips{display:flex;gap:7px;overflow:auto}.raid-switch{display:flex;gap:7px;overflow:hidden;padding:2px 0 10px}.raid-switch button{flex:1;min-width:0}.raid-viewport{overflow:hidden;touch-action:pan-y}.raid-track{display:flex;width:200%;transition:transform .25s ease}.raid-pane{width:50%;padding-right:1px}.raid-detail{line-height:1.55}')
          start=s.index('async function raids(){')
          end=s.index('\nasync function wild', start)
          new=r'''async function raids(){let b=$('raids');b.innerHTML='<div class="raid-switch"><button class="chip active" data-rtab="0">Normal / Mega</button><button class="chip" data-rtab="1">Shadow Raids</button></div><div class="raid-viewport"><div class="raid-track" id="raidTrack"><div class="raid-pane" id="raidNormal"><div class="empty">Henter…</div></div><div class="raid-pane" id="raidShadow"><div class="empty">Henter…</div></div></div></div>';let track=$('raidTrack'),active=0;function tab(i){active=i;track.style.transform=`translateX(${-50*i}%)`;document.querySelectorAll('[data-rtab]').forEach(x=>x.classList.toggle('active',+x.dataset.rtab===i))}document.querySelectorAll('[data-rtab]').forEach(x=>x.onclick=()=>tab(+x.dataset.rtab));let sx=0,sy=0;track.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});track.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))tab(dx<0?1:0)},{passive:true});try{let raw=await get(U.raids,60000),groups=Object.entries(raw||{}),normal=[],shadow=[];groups.forEach(([tier,ls])=>(Array.isArray(ls)?ls:[]).forEach(r=>{if(!r||!r.name)return;(r.is_shadow||r.isShadow||/^shadow\b/i.test(r.name)?shadow:normal).push({...r,group:tier})}));const tier=r=>{let t=String(r.tier??r.group??'').toLowerCase();if(t.includes('mega'))return'Mega';if(t.includes('5'))return'5-stjernet';if(t.includes('3'))return'3-stjernet';return'1-stjernet'};const shinyChance=r=>{let v=r.shiny_chance??r.shinyChance??r.shiny_odds??r.shinyOdds;if(v!=null)return typeof v==='number'?(v<1?`${(v*100).toFixed(v*100%1?1:0)}% (ca. 1/${Math.round(1/v)})`:`1/${Math.round(v)}`):String(v);return r.shiny_available===true||r.shiny===true?'5% (ca. 1/20)':'Ingen shiny-chance';};const weakMap={Normal:['Kamp'],Fire:['Vand','Jord','Klippe'],Water:['Elektrisk','Græs'],Electric:['Jord'],Grass:['Ild','Is','Gift','Flyvende','Insekt'],Ice:['Ild','Kamp','Klippe','Stål'],Fighting:['Flyvende','Psykisk','Fe'],Poison:['Jord','Psykisk'],Ground:['Vand','Græs','Is'],Flying:['Elektrisk','Is','Klippe'],Psychic:['Insekt','Spøgelse','Mørke'],Bug:['Ild','Flyvende','Klippe'],Rock:['Vand','Græs','Kamp','Jord','Stål'],Ghost:['Spøgelse','Mørke'],Dragon:['Is','Drage','Fe'],Dark:['Kamp','Insekt','Fe'],Steel:['Ild','Kamp','Jord'],Fairy:['Gift','Stål']};function weaknesses(types){let out=new Set();(types||[]).forEach(t=>(weakMap[t]||[]).forEach(x=>out.add(x)));return [...out].join(' · ')||'Type-data ikke oplyst'}function counters(types){let w=(types||[]).map(x=>weakMap[x]||[]).flat();let u=[...new Set(w)];let c={Fire:['Mega Charizard Y','Mega Blaziken','Reshiram'],Water:['Primal Kyogre','Mega Swampert','Kyogre'],Electric:['Mega Manectric','Zekrom','Xurkitree'],Grass:['Mega Sceptile','Kartana','Mega Venusaur'],Ice:['Mega Glalie','Mamoswine','White Kyurem'],Fighting:['Mega Lucario','Terrakion','Mega Blaziken'],Ground:['Primal Groudon','Mega Swampert','Groudon'],Rock:['Mega Diancie','Mega Tyranitar','Rampardos'],Steel:['Mega Lucario','Metagross','Dusk Mane Necrozma'],Fairy:['Mega Gardevoir','Mega Diancie','Xerneas'],Flying:['Mega Rayquaza','Rayquaza','Moltres'],Psychic:['Mega Mewtwo Y','Mewtwo','Dawn Wings Necrozma'],Ghost:['Mega Gengar','Dawn Wings Necrozma','Giratina (Origin Forme)'],Dark:['Mega Tyranitar','Darkrai','Hydreigon'],Poison:['Mega Gengar','Nihilego','Roserade'],Bug:['Mega Pinsir','Volcarona','Pheromosa'],Dragon:['Mega Rayquaza','Eternatus','Palkia (Origin Forme)'],['Kamp']:['Mega Lucario','Terrakion','Lucario'],['Græs']:['Mega Sceptile','Kartana','Zarude']};let first=u[0];return {mega:c[first]||[],normal:(c[first]||[]).slice(0,3)}}function cp(r){return r.cp_range?.max??r.cpRange?.max??r.cp_range?.[1]??r.cpRange?.[1]??'—'}function players(r){return String(r.recommended_players??r.recommendedPlayers??r.min_battle_group_size??r.minBattleGroupSize??r.min_players??r.minPlayers??r.players??'—')}function card(r){let types=Array.isArray(r.types)?r.types:[];return `<div class="card click" data-raid="${encodeURIComponent(JSON.stringify(r))}"><div class=row><div class=img>${r.asset_url?`<img loading="lazy" src="${E(r.asset_url)}">`:'⚔️'}</div><div class=grow><div class=name>${E(r.name)}</div><div class=small>${E(types.join(' · ')||'Type ikke oplyst')} · ✨ ${E(shinyChance(r))}</div></div>›</div><div class=stats><div class=stat><b>${E(players(r))}</b><span>Spillere</span></div><div class=stat><b>${E(cp(r))}</b><span>Hundo CP</span></div><div class=stat><b>${r.shiny_available===true||r.shiny===true?'Ja':'—'}</b><span>Shiny</span></div></div></div>`}function pane(list){let h='';['1-stjernet','3-stjernet','5-stjernet','Mega'].forEach(t=>{let a=list.filter(r=>tier(r)===t);if(a.length)h+=`<div class=section>${t}</div>`+a.map(card).join('')});return h||'<div class=empty>Ingen aktuelle raids.</div>'}$('raidNormal').innerHTML=pane(normal);$('raidShadow').innerHTML=pane(shadow);function bind(){document.querySelectorAll('[data-raid]').forEach(x=>x.onclick=async()=>{let r=JSON.parse(decodeURIComponent(x.dataset.raid)),q=await poke(pid(r)),types=(r.types&&r.types.length?r.types:q?.types)||[],w=weaknesses(types),c=counters(types),chance=shinyChance(r),hundo=cp(r),boost=r.boosted_cp_range?.max??r.boostedCpRange?.max??r.boosted_cp_range?.[1]??r.boostedCpRange?.[1]??'—';open(`<div class=row><div class=img>${r.asset_url?`<img src="${E(r.asset_url)}">`:'⚔️'}</div><div class=grow><h2>${E(r.name)}</h2><div class=small>${E(types.join(' · ')||'Type ikke oplyst')}</div></div></div><div class=section>Svag imod</div><div class="card raid-detail"><b>${E(w)}</b></div><div class=section>Gode Mega / Primal counters</div><div class="card raid-detail">${c.mega.length?c.mega.map(v=>`• ${E(v)}`).join('<br>'):'Counter-data ikke oplyst'}</div><div class=section>Gode ikke-Mega counters</div><div class="card raid-detail">${c.normal.length?c.normal.map(v=>`• ${E(v)}`).join('<br>'):'Counter-data ikke oplyst'}</div><div class=section>Shiny chance</div><div class="card raid-detail">✨ ${E(chance)}</div><div class=stats><div class=stat><b>${E(hundo)}</b><span>Hundo CP</span></div><div class=stat><b>${E(boost)}</b><span>Boost hundo</span></div><div class=stat><b>${E(players(r))}</b><span>Spillere</span></div></div>`)});};bind();up()}catch(e){$('raidNormal').innerHTML='<div class=note>Kunne ikke hente raid-data.</div>';$('raidShadow').innerHTML='<div class=note>Kunne ikke hente Shadow-data.</div>'}}'''
          s=s[:start]+new+s[end:]
          s=s.replace("document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>show(x.dataset.p));", "document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>show(x.dataset.p));")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make raids swipeable and show weaknesses and shiny odds'
          git rm .github/workflows/patch-raid-swipe.yml
          git commit -m 'Remove temporary raid patch workflow'
          git push
