name: Fix In The Wild loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wild-loading.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-wild-loading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch In The Wild loading
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """    const a=await ev(), n=N(), m=new Map(), inc=[], lure=[];"""
          new = """    const n=N(), m=new Map(), inc=[], lure=[];\n    let a=[];\n    try {\n      a=await Promise.race([ev(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('events timeout')),8000))]);\n    } catch (_) {\n      a=[];\n    }"""
          if old not in text:
              raise SystemExit('Expected In The Wild anchor not found; refusing to modify index.html')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one In The Wild anchor; refusing to modify index.html')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate every JavaScript block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not blocks:
              raise SystemExit('No script blocks found')
          for i, block in enumerate(blocks, 1):
              with tempfile.NamedTemporaryFile('w', suffix=f'-script-{i}.js', encoding='utf-8', delete=False) as f:
                  f.write(block)
                  name = f.name
              result = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f'JavaScript validation failed for script block {i}')
          print(f'Validated {len(blocks)} JavaScript blocks')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix In The Wild loading timeout'
          git push
