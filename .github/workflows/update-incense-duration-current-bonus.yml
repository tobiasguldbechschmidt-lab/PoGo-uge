name: Update regular Incense current bonus duration
on:
  push:
    paths:
      - '.github/workflows/update-incense-duration-current-bonus.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make regular Incense duration independent of events
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pat=r'function showIncenseDuration\(\)\{[\s\S]*?\}\s*(?=function |document\.addEventListener|</script>)'
          repl="""function showIncenseDuration(){
          let h='<h2>Incense · Varighed</h2><div class=section>Normal varighed</div><div class=card><b>60 minutter</b><div class=small>Almindelig Incense varer normalt 60 minutter.</div></div><div class=section>Aktuel status</div><div class=card><b>Ingen eventbonus</b><div class=small>Daily Adventure Incense-bonusser påvirker ikke almindelig Incense. Eventer vises ikke her.</div></div><div class=section>Vigtigt</div><div class=card><div class=small>Almindelig Incense kan kun få længere varighed, når et event specifikt angiver en bonus for almindelig Incense. Denne visning bruger ikke Daily Adventure Incense-bonusser.</div></div>';
          open(h)
          }
          """
          ns,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit('showIncenseDuration function not found')
          p.write_text(ns)
          PY
          python3 - <<'PY'
          import re,subprocess
          s=open('index.html').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No scripts found')
          for i,js in enumerate(scripts):
              f=f'/tmp/pogo-{i}.js'; open(f,'w').write(js); subprocess.run(['node','--check',f],check=True)
          print('Validated',len(scripts),'script blocks')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove event bonus from regular Incense duration'
          git push
