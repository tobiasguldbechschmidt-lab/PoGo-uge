name: Restore menu navigation
'on':
  push:
    paths:
      - '.github/workflows/restore-menu-final.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove broken Incense patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r"document\.addEventListener\('click',e=>\{let b=e\.target\.closest\('\[data-incense-spawns\]'\);if\(b\)\{e\.stopPropagation\(\);showIncenseSpawns\(\)\}\}\);",'',s)
          s=re.sub(r"async function showIncenseSpawns\(\)\{[\s\S]*?\n\}\n(?=function showDailyIncense|function dailyIncenseCards)",'',s)
          s=re.sub(r"<button class=\\?\"card click\\?\" data-incense-spawns=\\?\"1\\?\"[\\s\\S]*?</button>",'',s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore working menu navigation'
          git push
