name: Remove lower duplicate Incense
on:
  push:
    paths:
      - 'remove-lower-incense.trigger'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove only lower Incense section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards()+bonusCards(inc,'Incense');"
          new="if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards();"
          if old not in s:
              raise SystemExit('Expected Incense render line not found; no change made')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove lower duplicate Incense section'
          git push