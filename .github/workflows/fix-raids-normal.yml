name: Safe app patch
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated wild guide
        run: python scripts/patch-wild-guide.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I)
          assert blocks, 'No script blocks found'
          for js in blocks:
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
              f.write(js); f.close()
              subprocess.run(['node','--check',f.name],check=True)
          assert 'id="wild-guide"' in s
          assert 'Event Spawns' in s
          assert '>Season<' in s
          assert '>Regional<' in s
          PY
      - name: Commit guide only when needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- index.html; then echo "No changes"; exit 0; fi
          git add index.html
          git commit -m "Add event spawns and Pokemon details"
          git push
