name: Fix In The Wild
on:
  push:
    paths:
      - scripts/fix-wild.py
      - .github/workflows/fix-wild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix-wild.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          for i,code in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'pogo_script_{i}.js'
              p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JavaScript syntax error in script {i}')
          print(f'Validated {len(scripts)} script blocks')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/fix-wild.py .github/workflows/fix-wild.yml
          git diff --cached --quiet || git commit -m 'Fix In The Wild rendering'
          git push
