name: Update In The Wild
on:
  push:
    paths:
      - 'scripts/update-wild.py'
      - '.github/workflows/update-wild.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update-wild.py
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update In The Wild tabs and details'
          git push
