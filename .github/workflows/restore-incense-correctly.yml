name: Restore correct Incense
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-incense-correctly.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous app and keep the regular Incense Spawns section
        run: |
          git show 55ffae2922d4ba557082c0288230f477caeb5853 > index.html
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old="if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards();"
          new="if(tab==='incense')b.querySelector('#wild-content').innerHTML=dailyIncenseCards()+bonusCards(inc,'Incense');"
          if old not in s:
              raise SystemExit('target line not found')
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore regular Incense Spawns section'
          git push
