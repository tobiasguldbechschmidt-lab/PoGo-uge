name: Add Daily Incense
on:
  push:
    paths:
      - '.github/workflows/add-daily-incense.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            "['Dragonite',149,4]":"['Dratini',147,4]","['Metagross',376,4]":"['Beldum',374,4]","['Gardevoir',282,4]":"['Ralts',280,4]","['Gengar',94,4]":"['Gastly',92,4]","['Machamp',68,4]":"['Machop',66,4]","['Gyarados',130,4]":"['Magikarp',129,4]","['Mamoswine',473,4]":"['Swinub',220,4]","['Rhyperior',464,4]":"['Rhyhorn',111,4]","['Aggron',306,4]":"['Aron',304,4]","['Flygon',330,4]":"['Trapinch',328,4]","['Houndoom',229,4]":"['Houndour',228,4]","['Talonflame',663,4]":"['Fletchling',661,4]","['Abomasnow',460,4]":"['Snover',459,4]","['Bewear',760,4]":"['Stufful',759,4]","['Altaria',334,4]":"['Swablu',333,4]","['Wigglytuff',40,4]":"['Jigglypuff',39,4]","['Jumpluff',189,4]":"['Hoppip',187,4]","['Shiftry',275,4]":"['Seedot',273,4]","['Toxicroak',454,4]":"['Croagunk',453,4]","['Slaking',289,4]":"['Slakoth',287,4]","['Forretress',205,4]":"['Pineco',204,4]","['Alolan Sandslash',28,4]":"['Alolan Sandshrew',27,4]","['Rapidash',78,4]":"['Ponyta',77,4]","['Pidgeot',18,4]":"['Pidgey',16,4]","['Blastoise',9,4]":"['Squirtle',7,4]","['Charizard',6,4]":"['Charmander',4]","['Venusaur',3,4]":"['Bulbasaur',1,4]","['Ampharos',181,4]":"['Mareep',179,4]","['Luxray',405,4]":"['Shinx',403,4]","['Alakazam',65,4]":"['Abra',63,4]"
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          s=s.replace("Ca. 1 ud af 10 · Pokémon der kan fanges","Ca. 1 ud af 10")
          s=s.replace("let sc=v[2]===1?'ca. 1/20':'ca. 1/64';","let sc=v[2]===1?'ca. 1/20':'ca. 1/512';")
          s=s.replace("function showDailyIncense(){let h=", "function showDailyIncense(){$('x').onclick=()=>$('modal').classList.remove('open');let h=")
          s=s.replace("let sc=v[2]===1?'ca. 1/20':'ca. 1/512';open(`<h2>", "let sc=v[2]===1?'ca. 1/20':'ca. 1/512';$('x').onclick=()=>showDailyIncense();open(`<h2>")
          s=s.replace("${e.u?`<p><a class=\"btn\" href=\"${E(e.u)}\" target=\"_blank\" rel=\"noopener noreferrer\">Læs mere om eventet ↗</a></p>`:''}", "${e.u?`<p><button class=\"btn\" type=\"button\" data-event-url=\"${E(e.u)}\" style=\"width:100%;cursor:pointer\">Læs mere om eventet ↗</button></p>`:''}")
          s=s.replace("const TYPE_NAMES=", "document.addEventListener('click',e=>{let b=e.target.closest('[data-event-url]');if(b){e.stopPropagation();location.href=b.dataset.eventUrl}});const TYPE_NAMES=")
          old="function shiny(p,q){let v=p.shiny_chance??p.shinyChance??p.shiny_odds??q?.shiny_chance??q?.shinyChance??q?.shiny_odds;if(v!=null)return typeof v==='number'?'1/'+Math.round(v<1?1/v:v):String(v);if(p.shiny_available!==true)return 'Ikke mulig';let t=String(p.tier||p.g||'').toLowerCase();return t.includes('5')?'ca. 1/20':'ca. 1/64'}"
          new="function shiny(p,q,mode){let v=p.shiny_chance??p.shinyChance??p.shiny_odds??q?.shiny_chance??q?.shinyChance??q?.shiny_odds;if(v!=null)return typeof v==='number'?'1/'+Math.round(v<1?1/v:v):String(v);if(p.shiny_available!==true)return 'Ikke mulig';if(mode==='wild')return 'ca. 1/512 (standard wild-rate)';let t=String(p.tier||p.g||'').toLowerCase();return t.includes('5')?'ca. 1/20':'ca. 1/64'}"
          s=s.replace(old,new)
          s=s.replace("shiny(p,q))","shiny(p,q,'wild'))")
          raid_fn="""async function raids(){let b=$('raids');try{let raw=await get(U.raids,60000),all=[];Object.entries(raw||{}).forEach(([group,ls])=>{if(Array.isArray(ls))ls.forEach(p=>all.push({...p,group}))});let normal=all.filter(p=>!/^shadow\\b/i.test(String(p.name||''))),shadow=all.filter(p=>/^shadow\\b/i.test(String(p.name||'')));let weakness={Normal:['Kamp'],Ild:['Vand','Jord','Klippe'],Vand:['Elektrisk','Græs'],Elektrisk:['Jord'],Græs:['Ild','Is','Gift','Flyvende','Bug'],Is:['Ild','Kamp','Klippe','Stål'],Kamp:['Flyvende','Psykisk','Fe'],Gift:['Jord','Psykisk'],Jord:['Vand','Græs','Is'],Flyvende:['Elektrisk','Is','Klippe'],Psykisk:['Bug','Spøgelse','Mørke'],Bug:['Ild','Flyvende','Klippe'],Klippe:['Vand','Græs','Kamp','Jord','Stål'],Spøgelse:['Spøgelse','Mørke'],Drage:['Is','Drage','Fe'],Mørke:['Kamp','Bug','Fe'],Stål:['Ild','Kamp','Jord'],Fe:['Gift','Stål']};let dk={Ground:'Jord',Rock:'Klippe',Water:'Vand',Fire:'Ild',Grass:'Græs',Electric:'Elektrisk',Ice:'Is',Fighting:'Kamp',Poison:'Gift',Flying:'Flyvende',Psychic:'Psykisk',Bug:'Bug',Ghost:'Spøgelse',Dragon:'Drage',Dark:'Mørke',Steel:'Stål',Fairy:'Fe',Normal:'Normal'};function cards(list){if(!list.length)return '<div class=note>Ingen aktive raidbosser fundet.</div>';let groups={};list.forEach(p=>{let g=p.group||'Raids';(groups[g]??=[]).push(p)});return Object.entries(groups).map(([g,ls])=>'<div class=section>'+E(g)+'</div>'+ls.map((p,i)=>{let id='r'+i+Math.random().toString(36).slice(2);return `<div class=card click data-rid="${E(id)}"><div class=row><div class=img>${p.asset_url?`<img src="${E(p.asset_url)}" alt="${E(p.name||'')}">`:'⚔️'}</div><div class=grow><div class=name>${E(p.name||'Raid boss')}</div><div class=small>${p.shiny_available===true?'✨ Shiny mulig':'Shiny ikke angivet'} · Tier ${E(String(p.tier??''))}</div></div>›</div></div>`}).join('')).join('')}function render(tab){let list=tab==='shadow'?shadow:normal;b.innerHTML=`<div class="raid-tabs"><button class="raid-tab ${tab==='normal'?'active':''}" data-rtab="normal">Mega / normale</button><button class="raid-tab ${tab==='shadow'?'active':''}" data-rtab="shadow">Shadow</button></div>${cards(list)}`;b.querySelectorAll('[data-rtab]').forEach(x=>x.onclick=()=>render(x.dataset.rtab));let idx=0;list.forEach(p=>{let el=[...b.querySelectorAll('[data-rid]')][idx++];if(!el)return;el.onclick=()=>{let ts=(p.types||[]).map(x=>dk[x]||x);let w=[...new Set(ts.flatMap(x=>weakness[x]||[]))];open(`<h2>${E(p.name||'Raid boss')}</h2><div class=section>Type</div><div class=card>${E(ts.join(' · ')||'Ikke oplyst')}</div><div class=section>Svag imod</div><div class=card>${E(w.join(' · ')||'Ikke oplyst')}</div><div class=section>Shiny-chance</div><div class=card>${E(shiny(p,null))}</div><div class=section>CP</div><div class=card>${p.cp_range?E(String(p.cp_range.min??'—')+' – '+String(p.cp_range.max??'—')):'Ikke oplyst'}</div>`)}})}render('normal');up()}catch(e){b.innerHTML='<div class=note>Kunne ikke hente raids. Tryk ↻ igen.</div>'}}"""
          if 'async function raids()' not in s:
              s=s.replace('async function wild(){',raid_fn+'\nasync function wild(){')
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix wild shiny rate'
          git push
