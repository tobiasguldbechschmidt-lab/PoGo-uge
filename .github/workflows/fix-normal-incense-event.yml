name: Validate normal Incense event details
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-normal-incense-event.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts,1):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(js); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print('JavaScript syntax OK')
          PY
