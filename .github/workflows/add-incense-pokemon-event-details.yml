name: Add event details to normal Incense Pokémon
on:
  push:
    paths:
      - '.github/workflows/add-incense-pokemon-event-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only normal Incense Pokémon details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function showIncenseSpawns(){')
          if start<0: raise SystemExit('showIncenseSpawns was not found')
          end=s.find('\n}', start)
          if end<0: raise SystemExit('showIncenseSpawns end was not found')
          block=s[start:end+2]
          if 'Hvilket event får den til at spawne?' not in block: raise SystemExit('Expected Incense event details are missing')
          old='<a class=\"btn\" href=\"${E(event_url)}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-align:center;text-decoration:none\">Åbn eventet ↗</a>'
          new='<button class=\"btn\" type=\"button\" data-incense-event-url=\"${E(event_url)}\" style=\"display:block;width:100%;text-align:center;cursor:pointer\">Åbn eventet ↗</button>'
          if old in block:
              block=block.replace(old,new,1)
          elif 'data-incense-event-url=\"${E(event_url)}\"' not in block:
              raise SystemExit('Normal Incense event link target was not found')
          s=s[:start]+block+s[end+2:]
          marker='function showIncenseDuration(){'
          listener="document.addEventListener('click',e=>{let b=e.target.closest('[data-incense-event-url]');if(b){e.stopPropagation();let u=b.dataset.incenseEventUrl;if(u)window.location.assign(u)}});"
          if '[data-incense-event-url]' not in s:
              pos=s.find(marker)
              if pos<0: raise SystemExit('showIncenseDuration marker was not found')
              s=s[:pos]+listener+s[pos:]
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for js in scripts:
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(js); name=f.name
              subprocess.run(['node','--check',name],check=True)
          for required in ['Hvilket event får den til at spawne?','Åbn eventet ↗','data-incense-event-url','window.location.assign']:
              if required not in s: raise SystemExit('Missing '+required)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix normal Incense event link target'
          git push
