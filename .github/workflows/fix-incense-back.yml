name: Fix Incense back button
on:
  push:
    paths:
      - 'index.html'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check <(python3 -c "import re; s=open('index.html').read(); print(re.search(r'<script>([\\s\\S]*?)</script>',s).group(1))")
