name: Structure normal Lure Module under Lure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lure-module-structure.yml'
      - 'scripts/fix-lure-module.py'
      - 'scripts/add-lure-pokemon-types.py'
      - 'scripts/match-lure-incense-spawns.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate Lure Module
        run: python3 scripts/fix-lure-module.py
      - name: Add clickable Pokemon types
        run: python3 scripts/add-lure-pokemon-types.py
      - name: Match Lure Spawns to Incense
        run: python3 scripts/match-lure-incense-spawns.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then echo 'No changes'; exit 0; fi
          git add index.html
          git commit -m 'Match Lure Spawns to Incense layout'
          git push
