name: Add wild event links

on:
  push:
    paths:
      - '.github/workflows/add-wild-event-links.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wild section
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function wild(){')
          if start<0: raise SystemExit('wild function not found')
          brace=s.find('{',start); depth=0; end=-1
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end<0: raise SystemExit('wild function end not found')
          replacement=r'''async function wild(){let b=$('wild');try{let a=await ev(),n=N(),m=new Map(),inc=[],lure=[];const active=e=>(!e.start||e.start<=n)&&(!e.end||e.end>=n);const arr=v=>Array.isArray(v)?v:[];const spawnArrays=e=>{let d=e.details||{},out=[];['spawns','wild_spawns','wildSpawns','pokemon','pokémon','encounters','wild'].forEach(k=>{out.push(...arr(e[k]),...arr(d[k]))});Object.keys(d).forEach(k=>{if(/spawn|encounter|wild/i.test(k))out.push(...arr(d[k]))});return out};a.filter(active).forEach(e=>{let title=e.title||e.name||'Event',url=e.article_url||e.url||'';spawnArrays(e).forEach(p=>{let q=typeof p==='string'?{name:p}:p||{},name=String(q.name||q.pokemon||q.species||q.pokemon_name||'').trim();if(!name)return;let key=name.toLowerCase();if(!m.has(key))m.set(key,{...q,name,events:[]});let item=m.get(key);if(q.asset_url)item.asset_url=q.asset_url;if(q.shiny_available===false)item.shiny_available=false;if(!item.events.some(v=>v.title===title))item.events.push({title,url})});(e.details?.bonuses||[]).forEach(v=>{let t=typeof v==='string'?v:v.text||v.name||'';if(/incense/i.test(t))inc.push([title,t]);if(/lure/i.test(t))lure.push([title,t])})});let a1=[...m.values()];let unique=x=>x.filter((v,i)=>x.findIndex(y=>y[0]===v[0]&&y[1]===v[1])===i);inc=unique(inc);lure=unique(lure);
const seasonal=[['Maschiff','Paldea-debut · Twilight Trails'],['Mabosstiff','Paldea-debut · Twilight Trails'],['Rhyhorn','Twilight Trails / Max- og sæsonindhold'],['Sneasel','Twilight Trails / sæsonindhold'],['Sizzlipede','Twilight Trails / sæsonindhold'],['Flamigo','Wild/event rotation'],['Weedle','Wild/event rotation'],['Pidgey','Wild/event rotation'],['Houndour','Wild/event rotation'],['Carvanha','Wild/event rotation'],['Emolga','Wild rotation'],['Fletchling','Wild rotation'],['Noibat','Wild rotation'],['Rookidee','Wild rotation']];
const regional=[['Farfetch’d','Sydkorea, Taiwan, Japan, Hong Kong'],['Kangaskhan','Australien'],['Mr. Mime','Europa'],['Tauros','USA og det sydlige Canada'],['Heracross','Central- og Sydamerika'],['Corsola','Kystområder mellem ca. 31°N og 26°S'],['Volbeat','Europa, Asien og Australien'],['Illumise','Nord-/Sydamerika og Afrika'],['Torkoal','Vest-/Sydøstasien'],['Zangoose','Europa, Asien og Australien'],['Seviper','Nord-/Sydamerika og Afrika'],['Lunatone','Vestlige halvkugle'],['Solrock','Østlige halvkugle'],['Tropius','Afrika og Mellemøsten'],['Relicanth','New Zealand og Oceanien'],['Pachirisu','Arktiske områder, bl.a. dele af Canada/Alaska/Rusland'],['Chatot','Sydlige halvkugle'],['Carnivine','Sydøstlige USA'],['West Sea Shellos','Vestlige halvkugle'],['East Sea Shellos','Østlige halvkugle'],['Mime Jr.','Europa · 5 km Eggs'],['Uxie','Asia-Pacific'],['Mesprit','Europa, Mellemøsten, Asien og Afrika'],['Azelf','Nord-/Sydamerika og Grønland'],['Pansage','Asia-Pacific'],['Pansear','Europa, Mellemøsten, Afrika og Indien'],['Panpour','Nord-/Sydamerika og Grønland'],['Sawk','Europa, Asien og Australien'],['Throh','Nord-/Sydamerika og Afrika'],['Red Stripe Basculin','Østlige halvkugle'],['Blue Stripe Basculin','Vestlige halvkugle'],['Maractus','Mexico, Centralamerika og Sydamerika'],['Sigilyph','Egypten og Grækenland'],['Bouffalant','New York-området'],['Heatmor','Europa, Asien og Australien'],['Durant','Nord-/Sydamerika og Afrika'],['Klefki','Frankrig, Luxembourg, sydøstlige England og vestlige Schweiz'],['Baile Oricorio','Europa, Mellemøsten og Afrika'],['Pom-Pom Oricorio','Amerika'],['Pa’u Oricorio','Afrika, Asien, Stillehavet og Caribien'],['Sensu Oricorio','Asia-Pacific'],['Debutante Furfrou','Amerika'],['Diamond Furfrou','Europa, Mellemøsten og Afrika'],['Star Furfrou','Asia-Pacific'],['La Reine Furfrou','Frankrig'],['Kabuki Furfrou','Japan'],['Pharaoh Furfrou','Egypten'],['Comfey','Hawaii'],['Red Flabébé','Europa, Mellemøsten og Afrika'],['Yellow Flabébé','Amerika'],['Blue Flabébé','Asia-Pacific'],['Hawlucha','Mexico'],['Celesteela','Sydlige halvkugle'],['Kartana','Nordlige halvkugle'],['Stakataka','Østlige halvkugle'],['Blacephalon','Vestlige halvkugle'],['Wiglett','Strand-biomer'],['Stonjourner','Storbritannien'],['Paldean Blaze Breed Tauros','Østlige halvkugle'],['Paldean Aqua Breed Tauros','Vestlige halvkugle'],['Paldean Tauros','Den Iberiske halvø']];
function imgFor(name){let id={'Farfetch’d':83,'Kangaskhan':115,'Mr. Mime':122,'Tauros':128,'Heracross':214,'Corsola':222,'Volbeat':313,'Illumise':314,'Torkoal':324,'Zangoose':335,'Seviper':336,'Lunatone':337,'Solrock':338,'Tropius':357,'Relicanth':369,'Pachirisu':417,'Chatot':441,'Carnivine':455,'West Sea Shellos':422,'East Sea Shellos':422,'Mime Jr.':439,'Uxie':480,'Mesprit':481,'Azelf':482,'Pansage':511,'Pansear':513,'Panpour':515,'Sawk':539,'Throh':538,'Red Stripe Basculin':550,'Blue Stripe Basculin':550,'Maractus':556,'Sigilyph':561,'Bouffalant':626,'Heatmor':631,'Durant':632,'Klefki':707,'Comfey':764,'Hawlucha':701,'Stonjourner':874,'Wiglett':960}[name];return id?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`:''}
function eventCards(){return a1.length?'<div class=section>Event-Pokémon i det fri</div>'+a1.map((p,i)=>`<div class="card click" data-w="${i}"><div class=row><div class=img>${p.asset_url?`<img src="${E(p.asset_url)}" alt="${E(p.name)}" loading="lazy">`:'🌿'}</div><div class=grow><div class=name>${E(p.name)}</div><div class=small>${E(p.events.map(v=>v.title).join(' · ')||'Event-spawn')}</div><div class=small>${p.shiny_available===false?'✨ Shiny ikke udgivet':'✨ Shiny: standard wild-odds'}</div></div>›</div></div>`).join(''):'<div class=note>Ingen aktive event-spawns registreret lige nu. Det er ikke en fejl — se <b>Sæson-spawns</b> for den normale rotation.</div>'}
function seasonalCards(){return '<div class=section>Twilight Trails · kendte sæson-/wild-rotationer</div><div class=note>Dette er en fallback, så fanen aldrig er tom. Wild-poolen ændrer sig efter sæson, område, biome og events, så disse er markeret som kendte sæson-/rotations-Pokémon og ikke som en komplet spawn-rate-liste.</div>'+seasonal.map(p=>`<div class="card click" data-season="${E(p[0])}"><div class=row><div class=img>🌿</div><div class=grow><div class=name>${E(p[0])}</div><div class=small>${E(p[1])}</div></div>›</div></div>`).join('')}
function regionalCards(){return '<div class=section>Regionale Pokémon · hvor kan de fanges?</div><div class=note>Regionale Pokémon er normalt bundet til bestemte områder. De kan dog lejlighedsvis dukke op via events, raids eller Eggs. Brug listen som normal geografisk spawn-vejledning.</div>'+regional.map(p=>`<div class="card"><div class=row><div class=img><img src="${E(imgFor(p[0]))}" alt="${E(p[0])}" loading="lazy" onerror="this.parentElement.textContent='🌍'"></div><div class=grow><div class=name>${E(p[0])}</div><div class=small>📍 ${E(p[1])}</div></div></div></div>`).join('')}
function render(tab){b.querySelectorAll('[data-wtab]').forEach(x=>x.classList.toggle('active',x.dataset.wtab===tab));let c=b.querySelector('#wild-content');if(tab==='event')c.innerHTML=eventCards();if(tab==='season')c.innerHTML=seasonalCards();if(tab==='regional')c.innerHTML=regionalCards();if(tab==='incense')c.innerHTML=dailyIncenseCards();if(tab==='lure')c.innerHTML=lureCards();b.querySelectorAll('[data-daily]').forEach(x=>x.onclick=()=>showDailyIncense());b.querySelectorAll('[data-w]').forEach(x=>x.onclick=async()=>{let p=a1[+x.dataset.w],q=await poke(pid(p)),t=[];const addT=v=>{if(v==null)return;if(Array.isArray(v)){v.forEach(addT);return}if(typeof v==='object'){addT(v.name??v.type??v.value??v.typeName);return}let z=typeof v==='number'?TYPE_NAMES[v]:String(v).trim();if(z&&!t.includes(z))t.push(z)};[q?.types,q?.type,q?.type1,q?.type2,q?.data?.types,q?.data?.type,q?.data?.type1,q?.data?.type2,p?.types,p?.type,p?.type1,p?.type2].forEach(addT);let events=p.events||[];open(`<h2>${E(p.name)}</h2><div class=section>Type</div><div class=card>${t.map(v=>E(v)).join(' · ')||'Ikke oplyst'}</div><div class=section>Shiny-chance</div><div class=card>✨ ${E(shiny(p,q,'wild'))}</div><div class=section>Hvorfor spawner den?</div>${events.length?events.map(v=>`<div class="card click" data-event-url="${E(v.url||'')}" ${v.url?'':'style="cursor:default"'}><div class=name>${E(v.title)}</div>${v.url?'<div class=small style="margin-top:5px">Åbn eventet ↗</div>':'<div class=small style="margin-top:5px">Event-link ikke oplyst.</div>'}</div>`).join(''):'<div class=card><div class=small>Event ikke oplyst.</div></div>'}`)});b.querySelectorAll('[data-season]').forEach(x=>x.onclick=async()=>{let p=x.dataset.season,q=await poke(pid({name:p}));let t=[];const addT=v=>{if(v==null)return;if(Array.isArray(v)){v.forEach(addT);return}if(typeof v==='object'){addT(v.name??v.type??v.value??v.typeName);return}let z=typeof v==='number'?TYPE_NAMES[v]:String(v).trim();if(z&&!t.includes(z))t.push(z)};[q?.types,q?.type,q?.type1,q?.type2,q?.data?.types,q?.data?.type,q?.data?.type1,q?.data?.type2].forEach(addT);open(`<h2>${E(p)}</h2><div class=section>Type</div><div class=card>${t.map(v=>E(v)).join(' · ')||'Ikke oplyst'}</div><div class=section>Status</div><div class=card>🌿 Kendt sæson-/wild-rotation. Den præcise pool kan ændres lokalt med biome, sæson og aktive events.</div>`)});}
b.innerHTML=`<div class="wild-tabs"><button class="wild-tab active" data-wtab="event">Event-spawns</button><button class="wild-tab" data-wtab="season">Sæson-spawns</button><button class="wild-tab" data-wtab="regional">Regionale</button><button class="wild-tab" data-wtab="incense">Incense</button><button class="wild-tab" data-wtab="lure">Lure</button></div><div id="wild-content"></div>`;b.querySelectorAll('[data-wtab]').forEach(x=>x.onclick=()=>render(x.dataset.wtab));render('event');up()}'''
          s=s[:start]+replacement+s[end:]
          blocks=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(blocks,1):
              f=Path(f'/tmp/wild-script-{i}.js');f.write_text(js,encoding='utf-8');subprocess.run(['node','--check',str(f)],check=True)
          for marker in ['Sæson-spawns','Regionale','regionalCards','Ingen aktive event-spawns registreret lige nu']:
              if marker not in s: raise SystemExit('Missing '+marker)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- index.html; then echo 'No changes'; exit 0; fi
          git add index.html
          git commit -m 'Add seasonal wild fallback and regional Pokemon guide'
          git push
