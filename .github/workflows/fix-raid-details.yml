name: Fix raid details
on:
  push:
    branches: [fix/live-overview-wild-dynamax-battles]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch raid UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("U={events:B+'events.json',raids:B+'raid_bosses.json',eggs:B+'egg_pool.json',research:B+'research_tasks.json'}", "U={events:B+'events.json',raids:B+'raid_bosses.json',eggs:B+'egg_pool.json',research:B+'research_tasks.json',types:'https://pokemon-go-api.github.io/pokemon-go-api/api/types.json'}")
          start=s.find('async function raids(){')
          end=s.find('async function wild', start)
          if start<0 or end<0:
              raise SystemExit('raid function boundaries not found')
          fn=r'''async function raids(){
            let b=$('raids');
            b.innerHTML='<div class="load">Henter raids…</div>';
            try{
              let raw=await get(U.raids,60000), arr=Object.values(raw||{}).flat().filter(x=>x&&typeof x==='object');
              let shadow=arr.filter(r=>r.is_shadow===true||r.isShadow===true||/^shadow\s/i.test(r.name||''));
              let normal=arr.filter(r=>!shadow.includes(r));
              let typeData=await get(U.types,86400000).catch(()=>[]);
              let typeMap={};
              (Array.isArray(typeData)?typeData:[]).forEach(t=>typeMap[String(t.type||'').toLowerCase()]=t);
              const da={Fire:'Ild',Water:'Vand',Grass:'Græs',Electric:'Elektrisk',Ice:'Is',Fighting:'Kamp',Poison:'Gift',Ground:'Jord',Flying:'Flyvende',Psychic:'Psykisk',Bug:'Insekt',Rock:'Klippe',Ghost:'Spøgelse',Dragon:'Drage',Dark:'Mørke',Steel:'Stål',Fairy:'Fe',Normal:'Normal'};
              const atk=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
              function typesOf(r){return (r.types||r.type||[]).map(x=>typeof x==='string'?x:(x?.type||x?.name||'')).filter(Boolean)}
              function weaknesses(r){
                let defs=typesOf(r).map(x=>String(x).toLowerCase());
                if(!defs.length)return [];
                return atk.map(a=>{
                  let mult=1, aa=a.toLowerCase();
                  for(let d of defs){let t=typeMap[d];if(!t)continue;if((t.doubleDamageFrom||[]).map(String).map(x=>x.toLowerCase()).includes(aa))mult*=1.6;else if((t.halfDamageFrom||[]).map(String).map(x=>x.toLowerCase()).includes(aa))mult*=0.625;else if((t.noDamageFrom||[]).map(String).map(x=>x.toLowerCase()).includes(aa))mult*=0.390625}
                  return {a,mult}
                }).filter(x=>x.mult>1).sort((a,z)=>z.mult-a.mult);
              }
              function shinyChance(r){
                let v=r.shiny_chance??r.shinyChance??r.shiny_odds??r.shinyOdds;
                if(typeof v==='number')return v<1?'1/'+Math.round(1/v):v+'%';
                if(v!=null)return String(v);
                return (r.shiny_available===true||r.shiny===true)?'Ca. 5% (1/20)':'Ingen shiny-chance';
              }
              function tier(r){let n=String(r.tier||r.level||'').toLowerCase(), name=String(r.name||'').toLowerCase();if(n.includes('mega')||name.includes('mega'))return 'Mega';let m=n.match(/[135]/);if(m)return m[0]+'-stjernet';return '5-stjernet'}
              function img(r){return r.asset_url||r.assetUrl||r.assets?.image||''}
              function title(r){return r.name||r.names?.English||'Raid boss'}
              function card(r){let ts=typesOf(r).map(x=>da[x]||x).join(' · ')||'Type ikke oplyst';return `<div class="card click" data-raid="${encodeURIComponent(JSON.stringify(r))}"><div class="row">${img(r)?`<div class="img"><img src="${E(img(r))}" alt=""></div>`:''}<div class="grow"><div class="name">${E(title(r))}</div><div class="small">${E(ts)} · ✨ ${E(shinyChance(r))}</div></div>›</div><div class="stats"><div class="stat"><b>${E(r.players||r.recommended_players||'—')}</b><span>spillere</span></div><div class="stat"><b>${E((r.cp_range||r.cpRange||[]).join(' – ')||'—')}</b><span>hundo CP</span></div><div class="stat"><b>${E(tier(r))}</b><span>kategori</span></div></div></div>`}
              function pane(list,label){let groups=['1-stjernet','3-stjernet','5-stjernet','Mega'];let h=`<div class="section">${label}</div>`;for(let g of groups){let xs=list.filter(r=>tier(r)===g);if(!xs.length)continue;h+=`<div class="section">${g}</div>`+xs.map(card).join('')}return h||'<div class="note">Ingen aktuelle raids.</div>'}
              b.innerHTML=`<div class="raid-switch"><button class="btn" id="raidNormal">Normal / Mega</button><button class="btn" id="raidShadow">Shadow Raids</button></div><div class="note">Swipe til venstre for Shadow Raids. Swipe til højre for Normal / Mega.</div><div class="raid-viewport"><div class="raid-track" id="raidTrack"><div class="raid-pane">${pane(normal,'Normal / Mega')}</div><div class="raid-pane">${pane(shadow,'Shadow Raids')}</div></div></div>`;
              let track=$('raidTrack'), mode=0;
              function setMode(m){mode=m;track.style.transform=`translateX(-${m*50}%)`;$('raidNormal').classList.toggle('active',m===0);$('raidShadow').classList.toggle('active',m===1)}
              $('raidNormal').onclick=()=>setMode(0);$('raidShadow').onclick=()=>setMode(1);
              let x0=0,y0=0,sw=false;track.parentElement.addEventListener('touchstart',e=>{let t=e.touches[0];x0=t.clientX;y0=t.clientY;sw=true},{passive:true});track.parentElement.addEventListener('touchend',e=>{if(!sw)return;sw=false;let t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))setMode(dx<0?1:0)},{passive:true});
              document.querySelectorAll('[data-raid]').forEach(x=>x.onclick=()=>{let r=JSON.parse(decodeURIComponent(x.dataset.raid)), ws=weaknesses(r);let ts=typesOf(r).map(v=>da[v]||v).join(' · ')||'Ukendt';let cp=r.cp_range||r.cpRange||[];let boost=r.boosted_cp_range||r.cp_range_boost||r.cpRangeBoost||[];let br=r.battleResult||{};open(`<div class="raid-detail"><h2>${E(title(r))}</h2><div class="small">${E(ts)}</div><div class="section">Svag imod</div><div>${ws.length?ws.map(w=>`<span class="chip">${E(da[w.a]||w.a)} · ${w.mult.toFixed(2)}×</span>`).join(' '):'Ingen type-data tilgængelig.'}</div><div class="section">Gode counters</div>${br.normal?.name?`<div class="small">• ${E(br.normal.name)} · ca. ${E(br.normal.totalEstimator||'')} spillere</div>`:''}${br.hard?.name?`<div class="small">• ${E(br.hard.name)} · ca. ${E(br.hard.totalEstimator||'')} spillere</div>`:''}<div class="section">Shiny-chance</div><div>${E(shinyChance(r))}</div><div class="section">Hundo CP</div><div>${E(cp.join(' – ')||'Ikke oplyst')}</div>${boost.length?`<div class="small">Boostet hundo: ${E(boost.join(' – '))}</div>`:''}</div>`});
              up();
            }catch(e){b.innerHTML='<div class="note">Kunne ikke hente raid-data.</div>'}
          }
          '''
          s=s[:start]+fn+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix raid weaknesses and shiny chance' || true
          git rm .github/workflows/fix-raid-details.yml
          git commit -m 'Remove temporary raid patch workflow'
          git push