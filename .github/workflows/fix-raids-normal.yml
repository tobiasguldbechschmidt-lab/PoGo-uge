name: Fix missing normal raid images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch raid renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('async function raids(){')
          end=s.index('async function wild()', start)
          new=r'''async function raids(){let b=$('raids');try{let raw=await get(U.raids,60000),all=[];Object.entries(raw||{}).forEach(([group,ls])=>{if(Array.isArray(ls))ls.forEach(p=>all.push({...p,group}))});let isShadow=p=>/^shadow\b/i.test(String(p.name||''))||/shadow/i.test(String(p.group||''));let isMega=p=>/mega/i.test(String(p.name||''))||/mega/i.test(String(p.group||''));let normal=all.filter(p=>!isShadow(p)&&!isMega(p)),mega=all.filter(p=>!isShadow(p)&&isMega(p)),shadow=all.filter(isShadow);let iconBase='https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon%20-%20256x256/Addressable%20Assets/';let iconMap={'alolan rattata':'pm19.fALOLA.icon.png','dunsparce':'pm206.icon.png','scraggy':'pm559.icon.png','fidough':'pm926.icon.png','alolan dugtrio':'pm51.fALOLA.icon.png','lapras':'pm131.icon.png','falinks':'pm870.icon.png','zacian (hero of many battles)':'pm888.fHERO.icon.png','zacian (hero)':'pm888.fHERO.icon.png'};if(!normal.length){normal=[{name:'Alolan Rattata',tier:1,group:'1-Star Raids',types:['Dark','Normal']},{name:'Dunsparce',tier:1,group:'1-Star Raids',types:['Normal']},{name:'Scraggy',tier:1,group:'1-Star Raids',types:['Dark','Fighting']},{name:'Fidough',tier:1,group:'1-Star Raids',types:['Fairy']},{name:'Alolan Dugtrio',tier:3,group:'3-Star Raids',types:['Ground','Steel']},{name:'Lapras',tier:3,group:'3-Star Raids',types:['Water','Ice']},{name:'Falinks',tier:3,group:'3-Star Raids',types:['Fighting']},{name:'Zacian (Hero of Many Battles)',tier:5,group:'5-Star Raids',types:['Fairy']}];}let typeMap={Grass:'Græs',Fire:'Ild',Water:'Vand',Electric:'Elektrisk',Ice:'Is',Fighting:'Kamp',Poison:'Gift',Ground:'Jord',Flying:'Flyvende',Psychic:'Psykisk',Bug:'Bug',Rock:'Sten',Ghost:'Spøgelse',Dragon:'Drage',Dark:'Mørke',Steel:'Stål',Fairy:'Fe',Normal:'Normal'};function shiny(p,kind){let n=String(p.name||'').toLowerCase();let t=String(p.tier??'');if(kind==='mega')return {rate:'1/64',pct:'1,56 %',note:'Mega Raid'};if(kind==='shadow'&&(/legendary|zapdos|moltres|articuno|mewtwo|lugia|ho-oh|regirock|regice|registeel|latias|latios|kyogre|groudon|rayquaza|dialga|palkia|heatran|giratina|cobalion|terrakion|virizion|reshiram|zekrom|landorus|tornadus|thundurus|xerneas|yveltal|zacian|zamazenta|regieleki|regidrago|nihilego|buzzwole|pheromosa|xurkitree|celesteela|kartana|guzzlord|necrozma|solgaleo|lunala|eternatus|zacian|zamazenta/i.test(n)||t==='5'))return {rate:'1/20',pct:'5 %',note:'Shadow Legendary'};if(kind==='normal'&&t==='5')return {rate:'1/20',pct:'5 %',note:'Legendary Raid'};return {rate:'1/64',pct:'1,56 %',note:'Shiny-eligible Raid'};}function imgFor(p){if(p.asset_url)return p.asset_url;let n=String(p.name||'').toLowerCase();return iconMap[n]?iconBase+iconMap[n]:''}function cards(list,kind){if(!list.length)return '<div class=note>Ingen aktive raidbosser fundet.</div>';let groups={};list.forEach(p=>{let g=p.group||'Raids';(groups[g]??=[]).push(p)});return Object.entries(groups).map(([g,ls])=>'<div class=section>'+E(g)+'</div>'+ls.map(p=>{let t=Array.isArray(p.types)?p.types.map(x=>typeMap[x]||x):[typeMap[p.type]||p.type||'Normal'];let im=imgFor(p),sh=shiny(p,kind);return '<div class="card click" data-raid="'+E(JSON.stringify({...p,_kind:kind}))+'"><div class=row><div class=img>'+(im?'<img src="'+E(im)+'" alt="'+E(p.name)+'" loading="lazy">':'⚔️')+'</div><div class=grow><div class=name>'+E(p.name||'Raid')+'</div><div class=small>'+E(t.join(' · '))+' · Tier '+E(String(p.tier??''))+'</div><div class=small>✨ Shiny: '+sh.rate+' ('+sh.pct+')</div></div>›</div></div>'}).join('')).join('')}function render(tab){let list=tab==='mega'?mega:tab==='normal'?normal:shadow;b.innerHTML='<div class="raid-tabs"><button class="raid-tab '+(tab==='normal'?'active':'')+'" data-raid-tab="normal">Normale</button><button class="raid-tab '+(tab==='mega'?'active':'')+'" data-raid-tab="mega">Mega</button><button class="raid-tab '+(tab==='shadow'?'active':'')+'" data-raid-tab="shadow">Shadow</button></div>'+cards(list,tab);document.querySelectorAll('[data-raid-tab]').forEach(x=>x.onclick=()=>render(x.dataset.raidTab));document.querySelectorAll('[data-raid]').forEach(x=>x.onclick=()=>{let p=JSON.parse(x.dataset.raid),kind=p._kind||'normal';let t=Array.isArray(p.types)?p.types.map(v=>typeMap[v]||v):[typeMap[p.type]||p.type||'Normal'];let sh=shiny(p,kind);open('<h2>'+E(p.name||'Raid')+'</h2><div class=section>Type</div><div class=card>'+E(t.join(' · '))+'</div><div class=section>Tier</div><div class=card>'+E(String(p.tier??'Ikke oplyst'))+'</div><div class=section>Shiny-chance</div><div class=card>✨ <b>'+E(sh.rate)+'</b> · '+E(sh.pct)+'<div class=small>'+E(sh.note)+'. Odds er estimerede spillerdata og kan ændres ved særlige events.</div></div>')});}render('normal');up()}catch(e){b.innerHTML='<div class=note>Kunne ikke hente raids.</div>'}}'''
          s=s[:start]+new+'async function wild()'+s[end+len('async function wild()'):]
          p.write_text(s)
          PY
          python3 - <<'PY'
          import re, subprocess, tempfile
          s=open('index.html').read()
          for x in re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I):
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(x);f.close();subprocess.run(['node','--check',f.name],check=True)
          PY
          grep -q 'data-raid-tab="normal"' index.html
          grep -q 'PokeMiners/pogo_assets' index.html
          grep -q 'Pokemon%20-%20256x256/Addressable%20Assets' index.html
          grep -q 'pm206.icon.png' index.html
          grep -q 'Shiny-chance' index.html
      - name: Commit
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-raids-normal.yml
          git commit -m "Show shiny odds for raids"
          git push