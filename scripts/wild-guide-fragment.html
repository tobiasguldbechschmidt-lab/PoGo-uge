<div id="wild-guide" style="display:none;margin-top:14px"><div class="section">Wild Guide</div><div class="note">Seasonal, Regional and Event Spawns are shown here only when Event Spawns is selected.</div><div style="display:flex;gap:8px;margin:0 0 10px;overflow:auto"><button type="button" class="wild-tab active" data-guide-tab="season">Season</button><button type="button" class="wild-tab" data-guide-tab="regional">Regional</button><button type="button" class="wild-tab" data-guide-tab="event">Event Spawns</button></div><div id="wild-guide-content"></div></div><script>(function(){const guide=document.getElementById('wild-guide'),wild=document.getElementById('wild'),season=[['Maschiff',942],['Mabosstiff',943],['Rhyhorn',111],['Sneasel',215],['Sizzlipede',850],['Flamigo',973],['Weedle',13],['Pidgey',16],['Houndour',228],['Carvanha',318],['Emolga',587],['Fletchling',661],['Noibat',714],['Rookidee',821]],regional=[['Farfetch’d','Japan, South Korea, Taiwan and Hong Kong',83],['Kangaskhan','Australia',115],['Mr. Mime','Europe',122],['Tauros','USA and southern Canada',128],['Heracross','Central and South America',214],['Corsola','Certain tropical coastal areas',222],['Tropius','Africa and parts of the Middle East',357],['Relicanth','New Zealand and Oceania',369],['Comfey','Hawaii',764],['Hawlucha','Mexico',701],['Stonjourner','United Kingdom',874]],EVENTS='https://raw.githubusercontent.com/zhenga8533/leak-duck/data/events.json',box=document.getElementById('wild-guide-content'),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),img=id=>id?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`:'';const norm=v=>{if(typeof v==='string')return{name:v,id:null,shiny:null};if(!v||typeof v!=='object')return null;let name=v.name||v.pokemon_name||v.pokemon||v.species||v.title,id=Number(v.id||v.pokemon_id||v.dex||v.dex_number)||null,shiny=v.shiny_rate||v.shinyRate||v.shiny_odds||v.shinyOdds||null;return name?{name,id,shiny}:null};function shinyText(v){if(!v)return'1 in 512 (standard wild estimate)';if(typeof v==='number')return v>0&&v<1?`1 in ${Math.round(1/v)}`:`1 in ${Math.round(v)}`;return String(v)}async function details(name,id,shiny){try{let q=id?`https://pokeapi.co/api/v2/pokemon/${id}`:`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(name.toLowerCase().replace(/[’']/g,''))}`,r=await fetch(q);if(!r.ok)throw 0;let d=await r.json(),types=(d.types||[]).map(x=>x.type.name.replace(/^./,x=>x.toUpperCase())).join(' · ');return`<div class="row"><div class="img"><img src="${img(d.id)}" alt="${esc(name)}" style="width:72px;height:72px;object-fit:contain"></div><div class="grow"><h2 style="margin:0">${esc(name)}</h2><div class="small">${esc(types||'Unknown type')}</div></div></div><div class="section">Type</div><div class="small">${esc(types||'Unknown type')}</div><div class="section">Shiny Chance</div><div class="small">${esc(shinyText(shiny))}</div>`}catch{return`<h2>${esc(name)}</h2><div class="section">Type</div><div class="small">Unknown</div><div class="section">Shiny Chance</div><div class="small">${esc(shinyText(shiny))}</div>`}}function card(p,extra){let name=p[0]||p.name,id=Number(p[1]||p.id)||null,sub=extra||'';return`<div class="card click" data-pokemon-name="${esc(name)}" data-pokemon-id="${id||''}" data-shiny="${esc(p.shiny||'')}"><div class="row"><div class="img" style="min-width:64px;min-height:64px;display:flex;align-items:center;justify-content:center"><img src="${img(id)}" alt="${esc(name)}" width="64" height="64" loading="lazy" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png'" style="width:64px;height:64px;object-fit:contain"></div><div class="grow"><div class="name">${esc(name)}</div>${sub?`<div class="small">${esc(sub)}</div>`:''}</div><span>›</span></div></div>`}function renderSeason(){box.innerHTML='<div class="section">Season</div>'+season.map(p=>card(p,'Season / wild rotation')).join('')}function renderRegional(){box.innerHTML='<div class="section">Regional</div>'+regional.map(p=>card([p[0],p[2]],p[1])).join('')}async function renderEvent(){box.innerHTML='';try{let r=await fetch(EVENTS+'?t='+Date.now());if(!r.ok)return;let raw=await r.json(),all=Object.values(raw||{}).flat(),now=Date.now(),found=[];for(const e of all){let st=e.start_time?new Date(e.start_time):e.start?new Date(e.start):null,en=e.end_time?new Date(e.end_time):e.end?new Date(e.end):null;if(st&&st.getTime()>now)continue;if(en&&en.getTime()<now)continue;for(const x of e.spawns||e.details?.spawns||e.details?.pokemon||[]){let n=norm(x);if(n)found.push(n)}}let seen=new Set();found=found.filter(x=>{let k=x.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});if(!found.length)return;box.innerHTML='<div class="section">Event Spawns</div>'+found.map(x=>card({0:x.name,1:x.id,shiny:x.shiny},'Currently featured in an active event')).join('')}catch(e){box.innerHTML=''}}function render(tab){document.querySelectorAll('[data-guide-tab]').forEach(x=>x.classList.toggle('active',x.dataset.guideTab===tab));if(tab==='season')renderSeason();else if(tab==='regional')renderRegional();else renderEvent()}function text(el){return(el?.textContent||'').replace(/\s+/g,' ').trim().toLowerCase()}function isEvent(el){let t=text(el);return t.includes('event')&&t.includes('spawn')}function isOther(el){let t=text(el);return t.includes('incense')||t.includes('lure')||t.includes('wild')}function sync(){if(!wild)return;let active=[...wild.querySelectorAll('button,.chip,[role="tab"]')].find(x=>x.classList.contains('active')||x.getAttribute('aria-selected')==='true');if(active){let show=isEvent(active);guide.style.display=show?'block':'none';if(show){if(guide.parentElement!==wild)wild.appendChild(guide);render('event')}}}wild?.addEventListener('click',e=>{if(guide.contains(e.target))return;let tab=e.target.closest('button,.chip,[role="tab"]');if(!tab)return;setTimeout(sync,0)});new MutationObserver(sync).observe(wild,{childList:true,subtree:true,attributes:true,attributeFilter:['class','aria-selected']});document.addEventListener('click',async e=>{let c=e.target.closest('[data-pokemon-name]');if(!c||!guide.contains(c))return;let name=c.dataset.pokemonName,id=Number(c.dataset.pokemonId)||null,shiny=c.dataset.shiny||null;let h=await details(name,id,shiny);document.getElementById('mb').innerHTML=h;document.getElementById('modal').classList.add('open')});document.querySelectorAll('[data-guide-tab]').forEach(x=>x.onclick=()=>render(x.dataset.guideTab));sync()})()</script>
